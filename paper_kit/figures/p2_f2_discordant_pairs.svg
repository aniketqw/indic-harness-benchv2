' height='16' rx='3' fill='#2a78d6'><title>only English: 15</title></rect><rect x='402' y='144' width='90' height='16' rx='3' fill='#eb6834'><title>only Hinglish: 10</title></rect><text x='259.0' y='156.0' font-size='11' fill='#52514e' text-anchor='end' font-weight='normal'>15 only English</text><text x='498.0' y='156.0' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>10 only Hinglish</text><text x='20.0' y='201.0' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Model</text><text x='20.0' y='216.0' font-size='10' fill='#52514e' text-anchor='start' font-weight='normal'>96 pairs, 52 both, 2 neither</text><rect x='202' y='188' width='198' height='16' rx='3' fill='#2a78d6'><title>only GLM: 22</title></rect><rect x='402' y='188' width='180' height='16' rx='3' fill='#eb6834'><title>only Nemotron: 20</title></rect><text x='196.0' y='200.0' font-size='11' fill='#52514e' text-anchor='end' font-weight='normal'>22 only GLM</text><text x='588.0' y='200.0' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>20 only Nemotron</text><line x1='401' x2='401' y1='44' y2='220' stroke='#52514e'/><text x='20.0' y='240.0' font-size='10' fill='#52514e' text-anchor='start' font-weight='normal'>Each pair = same task, all other factors fixed. Blue = first-named side only; orange = second-named side only.</text></svg>